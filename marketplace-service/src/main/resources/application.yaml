spring:
  application:
    name: marketplace-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
  jpa:
    properties:
      # UPDATEs in a flush are sorted by entity and id, so two checkouts buying the same products
      # lock the product rows in the same (ascending id) order and cannot deadlock each other.
      hibernate.order_updates: true
    # Schema is owned by Flyway; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Entities never leave the service layer, so lazy loading in the web layer is not needed.
    open-in-view: false
  flyway:
    enabled: true
  session:
    # Server-side sessions in PostgreSQL (Spring Session JDBC): every instance sees the same sessions, and logout or
    # expiry deletes them for good. The tables come from Flyway (V6), not from runtime DDL.
    timeout: ${SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Keys (order id) and values (JSON already built by the outbox) are plain strings.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Reliable delivery: the leader and all in-sync replicas must have the record before it counts as sent.
      acks: all
      properties:
        # Idempotent producer: broker-side dedup of the producer's own internal retries (no duplicates, no
        # reordering within a partition). It does NOT dedup our outbox re-sends: those carry the same eventId
        # and are deduplicated by the consumer.
        enable.idempotence: true
        # Retries are left at the default (effectively unlimited) and bounded by time instead:
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        # How long send() may block waiting for metadata when the broker is unreachable.
        max.block.ms: 5000
    template:
      # Producer spans + the W3C "traceparent" header on every record: the consumer continues the checkout's trace
      # (restored from the outbox row by OutboxTracing). Also times each send (spring.kafka.template metric).
      observation-enabled: true

server:
  tomcat:
    mbeanregistry:
      # Exposes Tomcat's request thread pool as metrics (tomcat_threads_busy_threads / _config_max_threads): the
      # direct view of "all request threads are waiting for a slow downstream".
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

payment:
  client:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8081}
    connect-timeout: 1s
    # Time until payment-service's response headers arrive. Longer waits are treated as "result unknown".
    read-timeout: 2s
    # Dev/test only: forwards the client's X-Payment-Scenario header to payment-service.
    # Never enable in a real deployment: it lets callers control the payment provider's behaviour.
    forward-scenario-header: ${PAYMENT_FORWARD_SCENARIO_HEADER:false}
    # Shared secret for payment-service (Authorization: Bearer). The default is for LOCAL DEVELOPMENT ONLY and must be
    # overridden with PAYMENT_SERVICE_TOKEN anywhere else; payment-service uses the same variable.
    service-token: ${PAYMENT_SERVICE_TOKEN:dev-only-payment-service-token}
    retry:
      # Worst case with retries: 3 attempts, waits of ~200ms and ~400ms (+/- 50% jitter).
      max-attempts: 3
      initial-backoff: 200ms
      backoff-multiplier: 2.0
      randomization-factor: 0.5
    circuit-breaker:
      # Opens when at least half of the last 10 calls failed, but not before 5 calls were recorded.
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-number-of-calls: 5
      # While open, calls fail fast without touching payment-service. Then 2 trial calls (half-open)
      # decide whether it closes again or reopens.
      wait-duration-in-open-state: 15s
      permitted-calls-in-half-open-state: 2

outbox:
  topics:
    # One topic for all order events, keyed by order id (ordering per order, parallelism across orders).
    Order: ${ORDER_EVENTS_TOPIC:marketplace.order-events}
  topic-partitions: 3
  publisher:
    enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    poll-interval: 500ms
    batch-size: 50
    # Must be >= producer delivery.timeout.ms so that a send is not abandoned while the producer still retries.
    send-timeout: 12s
    initial-retry-backoff: 1s
    max-retry-backoff: 60s

logging:
  level:
    # The Kafka clients log their complete configuration at INFO on every start.
    org.apache.kafka: WARN
  pattern:
    # traceId/spanId from the MDC on every log line (empty outside a traced request/task), key=value like the messages.
    # Search one trace id to get every line of a checkout across marketplace, payment-service and order-activity.
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}] "

app:
  security:
    session-cookie:
      # The only authentication credential in the browser; always HttpOnly (JavaScript and XSS cannot read it), path /.
      name: MARKETPLACE_SESSION
      # Secure by default: production is expected behind HTTPS. Plain-HTTP local development: SESSION_COOKIE_SECURE=false
      # (most browsers also accept Secure cookies on http://localhost).
      secure: ${SESSION_COOKIE_SECURE:true}
      same-site: Lax
    cors:
      # Exact origins only (credentials are allowed, so never "*"). Comma-separated.
      allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  management:
    # Bearer token for /actuator/** (except the public health probes), sent by Prometheus when scraping.
    # LOCAL DEVELOPMENT default only (a warning is logged); set MANAGEMENT_TOKEN anywhere else.
    token: ${MANAGEMENT_TOKEN:dev-only-management-token}

# --- Phase 6: management endpoints, metrics, tracing ------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # Explicit allow-list. env, configprops, beans, heapdump, threaddump, loggers, ... are NOT exposed over HTTP:
        # they leak configuration or process memory. Dumps are taken locally with jcmd (docs/production-diagnostics.md).
        include: health, info, metrics, prometheus
  endpoint:
    health:
      # Public /actuator/health: UP/DOWN only. Details only in the token-protected "dependencies" group.
      show-details: never
      show-components: never
      status:
        # DEGRADED (a dependency impaired, the service still usable: payment circuit open, outbox lagging) ranks
        # BELOW UP here, so it never turns the public health DOWN. Only a real local failure (database) does.
        order: down, out-of-service, up, degraded, unknown
      probes:
        # /actuator/health/liveness and /actuator/health/readiness
        enabled: true
      group:
        liveness:
          # "Is the process alive?" Never depends on other systems: a DB outage must not restart every instance.
          include: livenessState
        readiness:
          # "Should the load balancer send traffic here?" Only what every request needs: the database.
          # Kafka (outbox buffers events) and payment-service (checkout degrades safely) are deliberately NOT here.
          include: readinessState, db
        dependencies:
          # Operator view, protected by the management token: every dependency with details. Passive checks only.
          include: db, outbox, paymentService
          show-details: always
          show-components: always
          status:
            # The operator view shows the worst dependency state; still 200 for DEGRADED, 503 only for DOWN.
            order: down, out-of-service, degraded, unknown, up
  info:
    java:
      enabled: true
    os:
      enabled: true
  metrics:
    tags:
      # Constant, bounded tag on every meter; Prometheus adds instance/job itself.
      application: ${spring.application.name}
    distribution:
      # Histogram buckets (not client-side percentiles): Prometheus computes p50/p95/p99 across instances and time
      # windows with histogram_quantile(). Only for the latency timers we actually discuss, not for every meter.
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
        http.client.requests: 1ms
      maximum-expected-value:
        http.server.requests: 30s
        http.client.requests: 30s
  tracing:
    sampling:
      # Training setup: every request is traced. Production typically samples (e.g. 0.1) or samples at a collector.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      # W3C trace context (traceparent header) in and out.
      type: w3c
    export:
      otlp:
        # Spans are always created and propagated (trace ids in logs, W3C headers to payment-service/Kafka), but only
        # exported when a tracing backend runs: docker compose --profile observability up -d + TRACING_EXPORT_ENABLED=true.
        # (Not management.tracing.export.enabled: in Boot 4 that switch also turns off propagation.)
        enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
