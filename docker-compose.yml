services:
  postgres:
    image: postgres:18-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<version>/
      - marketplace-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node Kafka in KRaft mode (no ZooKeeper): one process is both broker and controller.
  # Local development only: replication factor 1, no authentication, data lost with the container.
  kafka:
    image: apache/kafka:4.1.1
    container_name: marketplace-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # Services run on the host (mvn spring-boot:run), so clients connect to localhost:9092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the services (3 partitions); no silent 1-partition auto-creation.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # --- Optional observability stack (Phase 6): docker compose --profile observability up -d ---------------------------
  # Local training setup only: no persistence, fixed dev credentials, anonymous Grafana viewer.

  # Scrapes /actuator/prometheus of the three services running on the host (mvn spring-boot:run / java -jar).
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: marketplace-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # Docker Desktop provides host.docker.internal; on Linux this maps it to the host.
      - "host.docker.internal:host-gateway"

  # Dashboards (provisioned from the repository) over Prometheus, with Jaeger as trace datasource.
  grafana:
    image: grafana/grafana:12.1.1
    container_name: marketplace-grafana
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # Tracing backend: receives OTLP from the services (TRACING_EXPORT_ENABLED=true), UI on http://localhost:16686.
  # Jaeger v2 all-in-one keeps traces in memory: lightweight, gone on restart.
  jaeger:
    image: jaegertracing/jaeger:2.9.0
    container_name: marketplace-jaeger
    profiles: ["observability"]
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP over HTTP (the services export here)

volumes:
  marketplace-postgres-data:
