spring:
  application:
    name: order-activity-service
  datasource:
    # Same PostgreSQL server as the marketplace locally, but its own schema, own tables and own Flyway history.
    # In production this would be a separate database: the consumer never reads the marketplace's tables.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketplace}
    username: ${DB_USERNAME:marketplace}
    password: ${DB_PASSWORD:marketplace}
    hikari:
      schema: order_activity
  flyway:
    schemas: order_activity
    default-schema: order_activity
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-activity-service
      # A new consumer group starts at the beginning of the topic and builds the projection from all events.
      auto-offset-reset: earliest
      # Offsets are committed by the listener container after the local transaction committed (ack-mode below).
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Used only to publish failed records to the dead-letter topic.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    listener:
      # Commit the offset of each record right after the listener returned successfully (= after our DB commit).
      ack-mode: record
      # One consumer thread per partition of the order-events topic.
      concurrency: 3
      # Consumer spans that continue the producer's W3C trace (traceparent header), MDC trace ids in the listener's
      # log lines, and a spring.kafka.listener timer.
      observation-enabled: true
    template:
      # The DLT producer: dead-lettered records carry the trace of the failed processing.
      observation-enabled: true

server:
  port: ${PORT:8082}

order-activity:
  topics:
    order-events: ${ORDER_EVENTS_TOPIC:marketplace.order-events}
    dead-letter: ${ORDER_EVENTS_DLT:marketplace.order-events.DLT}
    partitions: 3
  retry:
    # Transient failures: 1 delivery + 3 retries with 200 ms, 400 ms, 800 ms backoff, then the dead-letter topic.
    max-retries: 3
    initial-interval: 200ms
    multiplier: 2.0
  simulation:
    # Dev/test only: enables POST /api/simulation/failures to make the next matching events fail.
    enabled: ${ORDER_ACTIVITY_SIMULATION_ENABLED:false}
  security:
    # Every /api/ call (projection read, simulation) needs "Authorization: Bearer <token>". Separate secret from the
    # payment token. The default is for LOCAL DEVELOPMENT ONLY (a warning is logged); set ORDER_ACTIVITY_API_TOKEN elsewhere.
    api-token: ${ORDER_ACTIVITY_API_TOKEN:dev-only-order-activity-token}
  management:
    # Bearer token for /actuator/** except the public health probes (Prometheus sends it). Separate from the API token.
    # LOCAL DEVELOPMENT default only (a warning is logged); set MANAGEMENT_TOKEN anywhere else.
    token: ${MANAGEMENT_TOKEN:dev-only-management-token}

logging:
  level:
    org.apache.kafka: WARN
  pattern:
    # traceId/spanId from the MDC on every log line; the listener's lines carry the marketplace checkout's trace id.
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-}] "

# --- Phase 6: management endpoints, metrics, tracing ------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # Explicit allow-list; env, configprops, heapdump, threaddump, ... are never exposed over HTTP.
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: never
      show-components: never
      status:
        # DEGRADED (consumer stopped) ranks below UP for the public status: the API still serves projections.
        order: down, out-of-service, up, degraded, unknown
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          # Projection reads need the database; the Kafka consumer is NOT a readiness condition.
          include: readinessState, db
        dependencies:
          # Token-protected operator view with details. Passive checks only.
          include: db, kafkaConsumer
          show-details: always
          show-components: always
          status:
            order: down, out-of-service, degraded, unknown, up
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 30s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
    propagation:
      type: w3c
    export:
      otlp:
        # Spans are created and propagated always; exported to the OTLP endpoint only with TRACING_EXPORT_ENABLED=true.
        # (Not management.tracing.export.enabled: in Boot 4 that switch also turns off propagation.)
        enabled: ${TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
